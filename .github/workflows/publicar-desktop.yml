name: Publicar atualização do desktop

# A cada push na branch main, compila o sistema e publica o resultado na branch
# "desktop-dist". O botão "Forçar Atualização" do app Windows baixa os arquivos dela.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Compilar (telas + servidor)
        run: |
          npm run build:web
          npm run build:server

      - name: Montar pasta de publicação
        run: |
          mkdir -p out/_server
          cp -r dist/. out/
          cp dist-server/server.cjs dist-server/legacy-ipad1.html out/_server/
          touch out/.nojekyll

      - name: Publicar na branch desktop-dist
        run: |
          cd out
          git init -q -b desktop-dist
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" desktop-dist
